name: LineageOS 24.0 Android 17 preflight

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-24.0
    paths:
      - ".github/workflows/lineage24-preflight.yml"
      - "AndroidProducts.mk"
      - "BoardConfig.mk"
      - "device.mk"
      - "lineage_ice.mk"
      - "build/local_manifests/lineage-ice.xml"
      - "vintf/**"
      - "init/**"
      - "overlay/**"
      - "overlay-yaap/**"

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Verify Android 17 LineageOS and device branches exist
        shell: bash
        run: |
          set -euo pipefail
          check_branch() {
            local repo="$1"
            local branch="$2"
            if git ls-remote --exit-code --heads "https://github.com/${repo}.git" "$branch" >/dev/null; then
              echo "FOUND: ${repo} @ ${branch}"
            else
              echo "::error::Missing branch ${branch} in ${repo}"
              exit 1
            fi
          }
          check_branch "LineageOS/android" "lineage-24.0"
          check_branch "LineageOS/android_vendor_lineage" "lineage-24.0"
          check_branch "nightx24/android_device_realme_ice" "lineage-24.0"
          check_branch "nightx24/proprietary_vendor_realme_ice" "seventeen"
          check_branch "nightx24/android_device_oneplus_sm8350-common" "seventeen"
          check_branch "Debarpan102/proprietary_vendor_oneplus_sm8350-common" "seventeen"
          check_branch "nightx24/android_hardware_oplus" "seventeen"
          check_branch "nightx24/kernel_oneplus_sm8350" "seventeen"

      - name: Validate product selection and local manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f AndroidProducts.mk
          test -f lineage_ice.mk
          grep -q 'lineage_ice.mk' AndroidProducts.mk
          grep -q 'lineage_ice-userdebug' AndroidProducts.mk
          grep -q 'PRODUCT_NAME := lineage_ice' lineage_ice.mk
          grep -q 'PRODUCT_DEVICE := ice' lineage_ice.mk
          grep -q 'PRODUCT_MODEL := RMX3461' lineage_ice.mk
          grep -q 'vendor/lineage/config/common_full_phone.mk' lineage_ice.mk
          if grep -q 'derp_ice' AndroidProducts.mk; then
            echo "::error::DerpFest product still selected on LineageOS branch"
            exit 1
          fi
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("build/local_manifests/lineage-ice.xml").getroot()
          projects = {p.attrib.get("path"): p.attrib for p in root.findall("project")}
          expected = {
              "device/realme/ice",
              "vendor/realme/ice",
              "device/oneplus/sm8350-common",
              "vendor/oneplus/sm8350-common",
              "hardware/oplus",
              "kernel/oneplus/sm8350",
          }
          missing = expected - projects.keys()
          if missing:
              raise SystemExit("Missing local manifest paths: " + ", ".join(sorted(missing)))
          if projects["device/realme/ice"].get("revision") != "refs/heads/lineage-24.0":
              raise SystemExit("Device tree must track refs/heads/lineage-24.0")
          for path in sorted(expected):
              print(f"OK: {path} -> {projects[path].get('name')} @ {projects[path].get('revision')}")
          PY

      - name: Check device-local files referenced by product makefiles
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            audio/audio_platform_info_yupikidp.xml \
            audio/mixer_paths_yupikidp.xml \
            audio/sound_trigger_mixer_paths.xml \
            audio/sound_trigger_platform_info.xml \
            media/media_profiles_vendor.xml \
            init/init.oplus_ice.rc \
            init/Android.bp \
            configs/displayconfig/display_id_4630946741972277890.xml \
            vintf/compatibility_matrix.xml
          do
            if [[ ! -f "$path" ]]; then
              echo "::error::Missing referenced device file: $path"
              exit 1
            fi
            echo "OK: $path"
          done
          if grep -q 'overlay-yaap' device.mk; then
            echo "::error::YAAP overlay must not be enabled in LineageOS product"
            exit 1
          fi

      - name: Parse device XML resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          roots = [pathlib.Path("vintf"), pathlib.Path("init"), pathlib.Path("overlay"), pathlib.Path("overlay-yaap")]
          files = sorted({p for root in roots if root.exists() for p in root.rglob("*.xml") if p.is_file()})
          errors = []
          for path in files:
              try:
                  ET.parse(path)
              except ET.ParseError as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Parsed {len(files)} XML files.")
          PY

      - name: Summarize limitations
        if: always()
        run: |
          {
            echo "## LineageOS Android 17 preflight"
            echo
            echo "- Confirms repository branches and static product/manifest metadata only."
            echo "- Does not sync or compile the full Android source tree."
            echo "- Does not prove Android 17 compatibility, bootability, or hardware operation."
            echo "- Do not flash generated images until a full build and device-specific validation succeed."
          } >> "$GITHUB_STEP_SUMMARY"
