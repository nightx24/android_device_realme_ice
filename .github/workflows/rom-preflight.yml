name: Ice 17 ROM Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - ice-17
    paths:
      - ".github/workflows/rom-preflight.yml"
      - "AndroidProducts.mk"
      - "BoardConfig.mk"
      - "device.mk"
      - "derp_ice.mk"
      - "build/local_manifests/ice.xml"
      - "BUILDING.md"
      - "ANDROID17_PORT_AUDIT.md"

permissions:
  contents: read

jobs:
  preflight:
    name: Verify ROM sources before building
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out device tree
        uses: actions/checkout@v4

      - name: Verify required source branches
        shell: bash
        run: |
          set -euo pipefail
          check_branch() {
            local repo="$1"
            local branch="$2"
            if git ls-remote --exit-code --heads "https://github.com/${repo}.git" "$branch" >/dev/null; then
              echo "FOUND: ${repo} @ ${branch}"
            else
              echo "::error::Missing branch ${branch} in ${repo}"
              exit 1
            fi
          }
          check_branch "nightx24/android_device_realme_ice" "ice-17"
          check_branch "nightx24/proprietary_vendor_realme_ice" "seventeen"
          check_branch "nightx24/android_device_oneplus_sm8350-common" "seventeen"
          check_branch "Debarpan102/proprietary_vendor_oneplus_sm8350-common" "seventeen"
          check_branch "nightx24/android_hardware_oplus" "seventeen"
          check_branch "nightx24/kernel_oneplus_sm8350" "seventeen"
          check_branch "DerpFest-AOSP/android_manifest" "17"
          check_branch "DerpFest-AOSP/android_vendor_derpfest" "17"

      - name: Verify DerpFest common product config
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/DerpFest-AOSP/android_vendor_derpfest/17/config/common_mobile_full.mk" -o /tmp/common_mobile_full.mk
          grep -q 'vendor/lineage/config/common_mobile.mk' /tmp/common_mobile_full.mk
          echo "FOUND: DerpFest Android 17 common mobile config inheritance."

      - name: Verify Lahaina base and Yupik device fragment
        shell: bash
        run: |
          set -euo pipefail
          kernel="https://raw.githubusercontent.com/nightx24/kernel_oneplus_sm8350/seventeen/arch/arm64/configs/vendor"
          curl -fsSL "$kernel/lahaina-qgki_defconfig" -o /tmp/lahaina-qgki_defconfig
          curl -fsSL "$kernel/oplus_yupik_QGKI.config" -o /tmp/oplus_yupik_QGKI.config
          grep -q '^CONFIG_ARCH_LAHAINA=y$' /tmp/lahaina-qgki_defconfig
          grep -q '^CONFIG_ARCH_YUPIK=y$' /tmp/oplus_yupik_QGKI.config
          for option in CONFIG_OPLUS_NFC=y CONFIG_NFC_ST21_I2C=y CONFIG_TOUCHPANEL_ILITEK=y CONFIG_TOUCHPANEL_ILITEK_ILITEK7807S=y CONFIG_CNSS_QCA6750=y; do
            grep -q "^$option$" /tmp/oplus_yupik_QGKI.config || { echo "::error::Missing expected option: $option"; exit 1; }
          done
          grep -q '^CONFIG_CNSS_QCA6490=n$' /tmp/oplus_yupik_QGKI.config
          echo "Static Lahaina/Yupik config checks passed."
          echo "::warning::Static checks do not prove the merged kernel config is valid."

      - name: Parse device and common VINTF XML
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/nightx24/android_device_realme_ice/ice-17/vintf/compatibility_matrix.xml" -o /tmp/ice-compatibility_matrix.xml
          curl -fsSL "https://raw.githubusercontent.com/nightx24/android_device_oneplus_sm8350-common/seventeen/vintf/manifest.xml" -o /tmp/sm8350-manifest.xml
          curl -fsSL "https://raw.githubusercontent.com/nightx24/android_device_oneplus_sm8350-common/seventeen/vintf/manifest_odm.xml" -o /tmp/sm8350-manifest_odm.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ("/tmp/ice-compatibility_matrix.xml", "/tmp/sm8350-manifest.xml", "/tmp/sm8350-manifest_odm.xml"):
              root = ET.parse(path).getroot()
              print(f"XML OK: {path} <{root.tag}>")
          PY

      - name: Verify common vendor makefile
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/Debarpan102/proprietary_vendor_oneplus_sm8350-common/seventeen/sm8350-common-vendor.mk" -o /tmp/sm8350-common-vendor.mk
          grep -q 'PRODUCT_SOONG_NAMESPACES' /tmp/sm8350-common-vendor.mk

      - name: Validate local manifest and product configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f build/local_manifests/ice.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("build/local_manifests/ice.xml").getroot()
          projects = {p.attrib.get("path"): p.attrib for p in root.findall("project")}
          expected = {"device/realme/ice", "vendor/realme/ice", "device/oneplus/sm8350-common", "vendor/oneplus/sm8350-common", "hardware/oplus", "kernel/oneplus/sm8350"}
          missing = expected - projects.keys()
          if missing:
              raise SystemExit("Missing local manifest paths: " + ", ".join(sorted(missing)))
          if projects["device/realme/ice"].get("revision") != "refs/heads/ice-17":
              raise SystemExit("device/realme/ice must sync refs/heads/ice-17")
          for path in sorted(expected):
              print(f"OK: {path} -> {projects[path].get('name')} @ {projects[path].get('revision')}")
          PY
          test -f BoardConfig.mk
          test -f device.mk
          test -f AndroidProducts.mk
          test -f derp_ice.mk
          grep -q 'derp_ice.mk' AndroidProducts.mk
          grep -q 'derp_ice-userdebug' AndroidProducts.mk
          grep -q 'PRODUCT_DEVICE := ice' derp_ice.mk
          grep -q 'PRODUCT_MODEL := RMX3461' derp_ice.mk
          grep -q 'vendor/lineage/config/common_mobile_full.mk' derp_ice.mk
          if grep -q 'yaap_ice' AndroidProducts.mk; then
            echo "::error::AndroidProducts.mk must select DerpFest, not YAAP"
            exit 1
          fi
          test "$(grep -c 'media_profiles_vendor.xml:$(TARGET_COPY_OUT_VENDOR)/etc/media_profiles_vendor.xml' device.mk)" -le 1
          echo "Product and manifest static checks passed."

      - name: Write preflight summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Ice 17 ROM preflight"
            echo
            echo "- Checks source presence and static configuration only."
            echo "- Does not sync Android source, compile ROM/kernel, flash a device, or produce OTA."
            echo "- Final Android 17 compatibility, HAL, proprietary blobs, overlays, partition layout and SELinux remain to be validated."
            echo "- Standard GitHub-hosted runners generally lack sufficient disk for a full Android build."
          } >> "$GITHUB_STEP_SUMMARY"

  kernel-config:
    name: Merge Lahaina and Yupik kernel Kconfig
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out kernel source
        uses: actions/checkout@v4
        with:
          repository: nightx24/kernel_oneplus_sm8350
          ref: seventeen
          path: kernel/oneplus/sm8350
          fetch-depth: 1

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev

      - name: Generate Lahaina base configuration
        working-directory: kernel/oneplus/sm8350
        run: make ARCH=arm64 vendor/lahaina-qgki_defconfig

      - name: Merge Yupik device fragment and resolve Kconfig
        working-directory: kernel/oneplus/sm8350
        run: |
          set -euo pipefail
          scripts/kconfig/merge_config.sh -m -r .config arch/arm64/configs/vendor/oplus_yupik_QGKI.config
          make ARCH=arm64 olddefconfig
          for option in CONFIG_ARCH_LAHAINA=y CONFIG_ARCH_YUPIK=y CONFIG_OPLUS_NFC=y CONFIG_NFC_ST21_I2C=y CONFIG_TOUCHPANEL_ILITEK=y CONFIG_TOUCHPANEL_ILITEK_ILITEK7807S=y CONFIG_CNSS_QCA6750=y; do
            grep -q "^$option$" .config || { echo "::error::Merged config missing $option"; exit 1; }
          done
          if grep -q '^CONFIG_CNSS_QCA6490=y$' .config; then
            echo "::error::Unexpected QCA6490 WLAN option enabled"
            exit 1
          fi
          echo "Merged Kconfig contains expected Lahaina and Yupik options."

      - name: Summarize scope
        if: always()
        run: |
          {
            echo "## Kernel Kconfig validation"
            echo
            echo "- Runs kernel Kconfig tools on the actual kernel source."
            echo "- Does not compile the kernel image or build the Android ROM."
            echo "- Passing is necessary but not sufficient to prove bootability."
          } >> "$GITHUB_STEP_SUMMARY"
